# AI 生图功能配置
# 启用后，AI 可在对话中调用 generate_image 工具按提示词生成图片
# 支持三种服务商：通义万相（阿里云）、DALL-E（OpenAI）、文心一格（百度）

# 生图功能全局开关
# 关闭后即使工具开关启用，也不会实际调用生图 API
Enable: false

# 默认服务商
# 可选：tongyi（通义万相）、dall_e（DALL-E）、wenxin（文心一格）、custom（自定义 OpenAI 兼容接口）
DefaultProvider: tongyi

# 请求超时时间（毫秒），生图通常较慢，建议 60000 以上
Timeout: 120000

# 单用户调用频率限制（秒），同一用户两次调用之间的最小间隔，0 表示不限制
RateLimit: 10

# 默认图片尺寸
# 通义万相支持：1024*1024、720*1280、1280*720
# DALL-E 支持：1024x1024、1792x1024、1024x1792
# 文心一格支持：1024*1024、1024*1536、1536*1024
DefaultSize: "1024*1024"

# 生成图片本地保存目录（相对于插件根目录）
# 留空则保存到 resources/output/imagegen
SaveDir: ""

# 通义万相配置（阿里云 DashScope）
Tongyi:
  # DashScope API Key，可在阿里云控制台开通后获取
  ApiKey: ""
  # 模型名称
  # wanx2.1-t2i-turbo（极速版，速度快，免费额度多）
  # wanx2.1-t2i-plus（高质量版，速度较慢）
  # wanx-v1（旧版通用模型）
  Model: "wanx2.1-t2i-turbo"
  # 默认风格，仅 wanx-v1 有效
  # 可选：<auto>、<photography>、<portrait>、<3d cartoon>、<anime>、<oil painting>、<watercolor>、<sketch>、<chinese painting>、<flat illustration>
  Style: "<auto>"
  # 异步任务轮询间隔（毫秒）
  PollInterval: 2000

# DALL-E 配置（OpenAI）
DallE:
  # OpenAI API Key
  ApiKey: ""
  # 接口基础地址，可替换为代理地址
  BaseUrl: "https://api.openai.com/v1"
  # 模型：dall-e-3（推荐，质量更好）、dall-e-2（更便宜）
  Model: "dall-e-3"
  # 图片质量（仅 dall-e-3 有效）：standard、hd
  Quality: "standard"
  # 返回格式：url（返回链接，1小时有效）、b64_json（返回base64）
  ResponseFormat: "url"

# 文心一格配置（百度千帆）
Wenxin:
  # 百度智能云 API Key（AK）
  ApiKey: ""
  # 百度智能云 Secret Key（SK）
  SecretKey: ""
  # 模型名称
  # wenxin-yige-2.0（文心一格 2.0）
  Model: "wenxin-yige-2.0"
  # access_token 缓存时间（秒），默认 86400（1天）
  TokenCacheTTL: 86400

# 自定义服务商配置（OpenAI 兼容接口）
# 适用于火山引擎 ARK、SiliconFlow、Together AI、Replicate 等第三方平台
# 这些平台均兼容 OpenAI 的 /images/generations 接口格式
Custom:
  # API Key
  ApiKey: ""
  # 接口基础地址（不含 API 路径部分）
  # 火山引擎 ARK：https://ark.cn-beijing.volces.com/api/v3
  # SiliconFlow：https://api.siliconflow.cn/v1
  # OpenAI：https://api.openai.com/v1
  # Together AI：https://api.together.xyz/v1
  BaseUrl: ""
  # API 路径，默认 /images/generations
  # 火山引擎 ARK：/images/generations
  # SiliconFlow：/images/generations
  ApiPath: "/images/generations"
  # 模型名称（根据平台填写）
  # 火山引擎 ARK：doubao-seedream-3-0-t2i-250415（豆包 Seedream 3.0）
  # SiliconFlow：Kwai-Kolors/Kolors、black-forest-labs/FLUX.1-schnell、stabilityai/stable-diffusion-3-5-large 等
  # Together AI：black-forest-labs/FLUX.1-schnell
  Model: ""
  # 图片质量（部分模型支持）：standard、hd
  Quality: "standard"
  # 返回格式：url（返回链接）、b64_json（返回base64）
  # 注意：部分平台仅支持其中一种格式
  ResponseFormat: "url"
  # 尺寸分隔符：x（OpenAI/Together 等）、*（部分国内平台）
  # 设置后会将传入的 size 参数统一转换为此分隔符
  SizeSeparator: "x"
  # 额外请求参数（JSON 字符串）
  # 部分平台需要额外参数（如 guidance_scale、num_inference_steps 等）
  # 示例：{"guidance_scale": 7.5, "num_inference_steps": 30}
  ExtraParams: ""

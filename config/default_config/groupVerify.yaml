# 入群真人验证总开关
# 开启后，VerifyGroups 中的群有新成员加入时，Bot 会发送随机问题验证真人
Enable: false

# AI 处理开关
# 开启后：出题、答案判定（语义等价即算对）、欢迎与提醒均由 AI 以人设口吻对话式生成
# 关闭或 AI 不可用时：自动使用本地题库与代码判定
UseAI: false

# 需要入群验证的群列表，格式：[ { group: 群号 }, ... ]
# 可通过指令（#添加验证群）、AI 工具（manage_verify_groups）或锅巴面板维护
VerifyGroups:

# 验证超时时间（秒），新成员超时未答对将公告后移出群聊（需Bot是管理员）
Timeout: 300

# 验证通过后的免验证时长（秒），期间退群重进不再验证；0 表示每次入群都验证
PassCooldown: 86400
